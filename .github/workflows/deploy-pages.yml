name: Deploy PixelPaws site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: GitHub Pages configureren
        uses: actions/configure-pages@v5

      - name: Sitebestanden uploaden als artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./pixelpaws-static-site"

      - name: Deployen naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4